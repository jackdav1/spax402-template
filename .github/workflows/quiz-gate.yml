name: quiz-gate

on:
  push:
    branches: ["**"]

jobs:
  quiz-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships Python 3 already, so there is no setup-python step here. It saves
      # ~20s per run and removes a dependency the gate does not need.
      - name: Every week that is due has a passing quiz artifact
        run: python3 scripts/quiz_gate.py
